name: Release

# This workflow is triggered when a new tag starting with 'v' (e.g., v0.1.0) is pushed.
on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI
  push:
    tags:
      - 'v*'

# Necessary permissions to create a release
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            platform: linux/amd64
            tag: linux-amd64
          
          # Windows builds
          - os: windows-latest
            platform: windows/amd64
            tag: windows-amd64

          # macOS builds (universal binary support)
          - os: macos-latest
            platform: darwin/amd64
            tag: macos-amd64
          - os: macos-latest
            platform: darwin/arm64
            tag: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: ${{ github.workspace }}/frontend

      - name: Run Type Check
        run: npm run type-check
        working-directory: ${{ github.workspace }}/frontend

      - name: Run Unit Tests
        run: npm run test:unit
        working-directory: ${{ github.workspace }}/frontend

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' # Using 1.26.x to accommodate Go 1.26.1 required by the project

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev rpm upx-ucl

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install upx

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Wails App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=${{ github.ref_name }}
          LDFLAGS="-X 'CodeTextor/backend/pkg/config.Version=$VERSION'"
          # Build portable binary
          wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41 -upx -ldflags "$LDFLAGS" -o CodeTextor-$VERSION-${{ matrix.tag }}
          # Build .deb and .rpm packages
          wails build -platform ${{ matrix.platform }} -tags webkit2_41 -package -ldflags "$LDFLAGS"
        shell: bash

      - name: Build Wails App (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          VERSION=${{ github.ref_name }}
          LDFLAGS="-X 'CodeTextor/backend/pkg/config.Version=$VERSION'"
          # Build portable binary
          wails build -clean -platform ${{ matrix.platform }} -upx -ldflags "$LDFLAGS" -o CodeTextor-$VERSION-${{ matrix.tag }}.exe
          # Build NSIS installer
          wails build -platform ${{ matrix.platform }} -nsis -ldflags "$LDFLAGS" -o CodeTextor-$VERSION-${{ matrix.tag }}-setup.exe
        shell: bash

      - name: Build Wails App (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=${{ github.ref_name }}
          LDFLAGS="-X 'CodeTextor/backend/pkg/config.Version=$VERSION'"
          wails build -clean -platform ${{ matrix.platform }} -upx -ldflags "$LDFLAGS"
        shell: bash

      - name: Package and Rename (macOS)
        if: startsWith(matrix.platform, 'darwin/')
        run: |
          VERSION=${{ github.ref_name }}
          cd build/bin
          zip -r CodeTextor-$VERSION-${{ matrix.tag }}.zip CodeTextor.app
          rm -rf CodeTextor.app
        shell: bash

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/CodeTextor-*
            build/bin/*.deb
            build/bin/*.rpm
          draft: true
          body: |
            ## 🧠 CodeTextor Release ${{ github.ref_name }}

            This is an automated build of CodeTextor version **${{ github.ref_name }}**.

            ### ⚠️ Security Notice
            These binaries are **not signed**. Your operating system (Windows Defender, macOS Gatekeeper, etc.) will likely show security warnings when you try to run them.

            **You can:**
            1. **Proceed with installation**: These binaries are automatically built by GitHub Actions directly from this repository's source code, ensuring that the executable corresponds exactly to the published code. However, you will need to manually bypass the security warning since the binaries are not digitally signed.
            2. **Build from source**: This is the recommended approach. If you have Go, Node.js, and Wails installed, follow the instructions in the [README](https://github.com/Alcarin/CodeTextor#build).

            *These artifacts were automatically generated by GitHub Actions.*
