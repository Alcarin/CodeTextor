[language]
name = "json"
extensions = [".json"]
grammar = "tree-sitter-json"

[queries]
symbols = """
(pair
  key: (string) @name
  value: [
    (string)
    (number)
    (true)
    (false)
    (null)
    (object)
    (array)
  ] @signature) @symbol.property
"""

[rules]
comment_prefixes = ["//"]

[rules.todo]
pattern = '(?i)(TODO|FIXME|HACK|XXX|NOTE):?\s*(.*)'
node_types = ["comment"]
