# Python Language Configuration
[language]
name = "python"
grammar = "tree-sitter-python"
extensions = [".py"]

[queries]
symbols = """
(class_definition
  name: (identifier) @name) @symbol.class

;; Methods: function definitions inside a class body
(class_definition
  body: (block
    (function_definition
      name: (identifier) @name) @symbol.method))

;; Generic functions (will be overridden by method if they occupy same range)
(function_definition
  name: (identifier) @name) @symbol.function

(assignment
  left: (identifier) @name) @symbol.variable
"""

imports = """
(import_statement
  (dotted_name) @import)

(import_from_statement
  module_name: (dotted_name) @import)
"""

usages = """
(call
  function: (identifier) @call.name) @call

(call
  function: (attribute
    object: (_) @call.receiver
    attribute: (identifier) @call.name)) @call
"""

[queries.extra]
docstring = """
(function_definition
  body: (block
    (expression_statement
      (string) @docstring)))

(class_definition
  body: (block
    (expression_statement
      (string) @docstring)))
"""

[rules.visibility]
type = "prefix_underscore"
private_prefix = "__"
protected_prefix = "_"

[rules.todo]
pattern = '(?i)(TODO|FIXME|HACK|XXX|NOTE):?\s*(.*)'
node_types = ["comment"]

[sub_languages]
string_content = "detect"
